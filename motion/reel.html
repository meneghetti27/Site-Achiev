<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Achiev Reels 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Reels 1080x1920 em 3D: ponto → plano técnico → planta → paredes sobem → móveis → vista explodida → sol → logo */
:root { --ink: #0C0A09; --paper: #FFF8F1; --o1: #FFB25C; --o2: #FF7A1F; --o3: #FF4F12;
  --grad: linear-gradient(120deg, var(--o1), var(--o2) 45%, var(--o3)); --f-display: "Sora", Arial, sans-serif; --f-mono: "DM Mono", monospace; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--f-display); }
canvas { position: absolute; inset: 0; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.mono { font: 500 24px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; }
#hud .tl, #hud .tr, #hud .bl, #hud .br { position: absolute; color: rgba(255,244,235,.6); }
#hud .tl { left: 64px; top: 90px; } #hud .tr { right: 64px; top: 90px; text-align: right; }
#hud .bl { left: 64px; bottom: 100px; } #hud .br { right: 64px; bottom: 100px; text-align: right; }
#hud b { color: var(--o2); font-weight: 500; }
#cross line { stroke: var(--o2); stroke-width: 2; }
#cross circle { fill: var(--o2); }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; padding: 12px 20px; border-radius: 999px; background: rgba(12,10,9,.75); border: 1px solid rgba(255,122,31,.6); color: var(--paper); font: 500 22px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; opacity: 0; }
.dim { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font: 500 26px/1 var(--f-mono); color: var(--o1); letter-spacing: .06em; opacity: 0; text-shadow: 0 0 12px rgba(0,0,0,.9); }
#title { position: absolute; left: 64px; right: 64px; top: 230px; }
#title .k { color: var(--o1); }
#title h2 { margin-top: 26px; font: 300 108px/1.02 var(--f-display); letter-spacing: -.04em; }
#title h2 span { display: block; overflow: hidden; padding-bottom: 6px; } #title h2 b { display: inline-block; font-weight: 300; }
#title h2 .g b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
#kin { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; }
#kin { background: radial-gradient(60% 40% at 50% 50%, rgba(12,10,9,.75), transparent); padding-block: 200px; }
#kin p { font: 800 200px/.9 var(--f-display); letter-spacing: -.05em; text-transform: uppercase; opacity: 0; }
#kin p:nth-child(2) { color: transparent; -webkit-text-stroke: 3px var(--paper); }
#kin p:nth-child(3) { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
#end { background: var(--grad); color: var(--ink); clip-path: inset(100% 0 0 0); }
#endLogo { position: absolute; left: 50%; top: 700px; width: 360px; transform: translate(-50%, -50%); overflow: visible; }
#endLogo > * { fill: var(--ink); fill-opacity: 0; stroke: var(--ink); stroke-width: 10; stroke-dasharray: 1; stroke-dashoffset: 1; }
#end .k { position: absolute; left: 0; right: 0; top: 1010px; text-align: center; opacity: 0; }
#end h2 { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; font: 300 104px/1.02 var(--f-display); letter-spacing: -.04em; }
#end h2 span { display: block; overflow: hidden; } #end h2 b { display: inline-block; font-weight: 300; }
#wa { position: absolute; left: 50%; top: 1420px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 20px; padding: 34px 54px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 600 50px/1 var(--f-display); white-space: nowrap; }
#wa svg { width: 54px; height: 54px; fill: var(--o2); }
#end .info { position: absolute; left: 0; right: 0; top: 1610px; text-align: center; opacity: 0; }
#grain { opacity: .06; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vig { background: radial-gradient(110% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
</style>
</head>
<body>
<div class="ov" id="vig"></div>
<svg class="ov" id="cross" viewBox="0 0 1080 1920"><line id="cx1" x1="540" y1="960" x2="540" y2="960"/><line id="cx2" x1="540" y1="960" x2="540" y2="960"/><circle id="cdot" cx="540" cy="960" r="0"/></svg>
<div class="ov" id="hud">
  <div class="tl mono">Achiev<br><span style="opacity:.6">Móveis planejados</span></div>
  <div class="tr mono" id="sheet">Projeto 001<br><span style="opacity:.6">Esc 1:50</span></div>
  <div class="bl mono" id="phase">Planta baixa</div>
  <div class="br mono"><b id="pct">000</b>%</div>
</div>
<div class="ov" id="labels"></div>
<div class="ov" id="title"><p class="mono k">Do primeiro desenho</p><h2><span><b>à realização</b></span><span class="g"><b>do seu ambiente.</b></span></h2></div>
<div class="ov" id="kin"><p>Seu espaço.</p><p>Seu estilo.</p><p>Seu projeto.</p></div>
<div class="ov" id="end">
  <svg id="endLogo" viewBox="0 0 930.65 770.68">
    <polygon pathLength="1" points="0 675.06 0 770.68 555.52 770.68 515.62 675.06 0 675.06"/>
    <polygon pathLength="1" points="187.72 0 7.03 458.6 0 0 187.72 0"/>
    <path pathLength="1" d="M312.46,0l39.44,97.22h578.75V0H312.46Z"/>
    <polygon pathLength="1" points="373.22 146.75 528 146.75 653.2 476.25 778.39 146.75 919.41 146.75 667.64 770.68 639.44 770.68 373.22 146.75"/>
    <path pathLength="1" d="M242.37,22.17L0,618.34h133.45l27.52-65.87h193.68c9.63,21.96,19.26,43.91,28.89,65.87h109.68L242.37,22.17ZM200.1,442.55v-2.29l55.95-154.55,56.87,156.84h-112.82Z"/>
  </svg>
  <p class="k mono">Orçamento gratuito</p>
  <h2><span><b>Vamos planejar</b></span><span><b>o seu espaço?</b></span></h2>
  <span id="wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg><span id="waTxt"></span></span>
  <p class="info mono">@achievplanejados · RS &amp; SC</p>
</div>
<div class="ov" id="grain"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DURATION = 20, W = 1080, H = 1920;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- cena ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0C0A09);
scene.fog = new THREE.Fog(0x0C0A09, 18, 34);
const camera = new THREE.PerspectiveCamera(38, W / H, .1, 100);
scene.add(new THREE.HemisphereLight(0xfff1e2, 0x1a1410, .75));
const sun = new THREE.DirectionalLight(0xffe2c4, 1.25);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: .5, far: 40 });
sun.shadow.bias = -.0006; scene.add(sun); scene.add(sun.target);
const ORANGE = 0xFF7A1F;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x080605, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const slab = new THREE.Mesh(new THREE.BoxGeometry(8.3, .06, 6.3), new THREE.MeshStandardMaterial({ color: 0x120E0B, roughness: .9 }));
slab.position.y = .03; slab.receiveShadow = true; scene.add(slab);
const grid = new THREE.GridHelper(40, 80, ORANGE, 0x3a2e24);
grid.material.transparent = true; grid.position.y = .001; scene.add(grid);

const OFF = new THREE.Vector3(-4, 0, -3);
const edgeMat = () => new THREE.LineBasicMaterial({ color: ORANGE, transparent: true, opacity: 0 });

/* paredes */
const WALLS = [[0,0,8,0],[8,0,8,6],[8,6,0,6],[0,6,0,0],[4.6,0,4.6,2.5],[0,3.6,3.3,3.6],[4.3,3.6,8,3.6],[2.8,3.6,2.8,6]];
const WH = 2.7, WT = .14;
const wallMat = new THREE.MeshStandardMaterial({ color: 0xEFE8DE, roughness: .85, transparent: true, opacity: 1 });
const walls = WALLS.map(([x1, z1, x2, z2], i) => {
  const len = Math.hypot(x2 - x1, z2 - z1) + WT;
  const g = new THREE.BoxGeometry(len, WH, WT); g.translate(0, WH / 2, 0);
  const m = new THREE.Mesh(g, wallMat); m.castShadow = m.receiveShadow = true;
  m.position.set((x1 + x2) / 2 + OFF.x, 0, (z1 + z2) / 2 + OFF.z);
  m.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat()); m.add(e);
  scene.add(m); return { m, e };
});

/* planta: linhas que se desenham */
function polyLine(pts, w = .07, color = 0xFFF1E2) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [a, b] = [pts[i], pts[i + 1]], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const g = new THREE.BoxGeometry(len + w, .02, w); g.translate((len + w) / 2 - w / 2, 0, 0);
    const m = new THREE.Mesh(g, mat); m.position.set(a[0] + OFF.x, .07, a[1] + OFF.z); m.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]);
    scene.add(m); segs.push(m);
  }
  return { segs, material: mat, draw(k) { const n = segs.length; segs.forEach((m, i) => { const kk = clamp(k * n - i); m.scale.x = Math.max(.0001, kk); m.visible = kk > 0; }); } };
}
const planLines = WALLS.map(([x1, z1, x2, z2]) => polyLine([[x1, z1], [x2, z2]], .1));
const furnPlan = [
  [[0.1,0.1],[4.4,0.1],[4.4,0.7],[0.7,0.7],[0.7,3.0],[0.1,3.0],[0.1,0.1]],
  [[1.4,1.6],[3.4,1.6],[3.4,2.4],[1.4,2.4],[1.4,1.6]],
  [[4.8,0.1],[7.9,0.1],[7.9,0.7],[4.8,0.7],[4.8,0.1]],
  [[5.5,1.5],[7.3,1.5],[7.3,3.4],[5.5,3.4],[5.5,1.5]],
  [[3.6,5.5],[6.4,5.5],[6.4,5.85],[3.6,5.85],[3.6,5.5]],
  [[3.9,4.0],[6.0,4.0],[6.0,4.9],[3.9,4.9],[3.9,4.0]],
  [[0.2,5.3],[2.6,5.3],[2.6,5.85],[0.2,5.85],[0.2,5.3]]
].map(p => polyLine(p, .05, ORANGE));

/* móveis */
const woodA = new THREE.MeshStandardMaterial({ color: 0xD9C6A8, roughness: .7 });
const woodB = new THREE.MeshStandardMaterial({ color: 0xBFAE96, roughness: .75 });
const dark = new THREE.MeshStandardMaterial({ color: 0x3B332C, roughness: .9 });
const white = new THREE.MeshStandardMaterial({ color: 0xF4EFE7, roughness: .6 });
function box(x1, z1, x2, z2, y1, y2, mat) {
  const g = new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1); g.translate(0, (y2 - y1) / 2, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true;
  m.position.set((x1 + x2) / 2 + OFF.x, y1, (z1 + z2) / 2 + OFF.z);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat()); m.add(e); m.userData = { y1, e };
  scene.add(m); return m;
}
const furn = [
  box(0.1,0.1,4.4,0.7,0,0.9,woodA), box(0.1,0.7,0.7,3.0,0,0.9,woodA),
  box(0.1,0.1,4.4,0.45,1.6,2.3,white), box(1.4,1.6,3.4,2.4,0,0.95,woodB),
  box(5.5,1.5,7.3,3.4,0,0.5,white), box(5.4,3.38,7.4,3.5,0,1.1,woodA),
  box(3.4,5.82,6.6,5.9,0,2.4,woodB), box(3.6,5.5,6.4,5.85,0.25,0.7,woodA),
  box(3.9,4.0,6.0,4.9,0,0.75,dark), box(0.2,5.3,2.6,5.85,0.72,0.78,woodA), box(0.2,5.6,2.6,5.85,1.4,1.45,woodA), box(0.2,5.6,2.6,5.85,1.9,1.95,woodA)
];

/* guarda-roupa explodido */
const wr = new THREE.Group(); scene.add(wr);
const WX1 = 4.8, WX2 = 7.9, WZ1 = 0.15, WZ2 = 0.75, WY = 2.55, th = .04;
const wPanels = [];
function wp(x1, z1, x2, z2, y1, y2, mat, dir) {
  const m = box(x1, z1, x2, z2, y1, y2, mat); scene.remove(m); wr.add(m);
  m.userData.base = m.position.clone(); m.userData.dir = new THREE.Vector3(...dir); wPanels.push(m); return m;
}
wp(WX1, WZ1, WX2, WZ1 + th, 0, WY, woodB, [0, 0, -1]);                 // fundo
wp(WX1, WZ1, WX1 + th, WZ2, 0, WY, woodA, [-1, 0, 0]);                 // lateral
wp(WX2 - th, WZ1, WX2, WZ2, 0, WY, woodA, [1, 0, 0]);                  // lateral
wp(WX1, WZ1, WX2, WZ2, WY - th, WY, woodA, [0, 1.3, 0]);               // tampo
wp(WX1, WZ1, WX2, WZ2, 0, .1, woodB, [0, -.3, 0]);                     // base
wp((WX1 + WX2) / 2 - .02, WZ1, (WX1 + WX2) / 2 + .02, WZ2, 0, WY, woodA, [0, .5, 0]);
[.9, 1.6].forEach(y => wp((WX1 + WX2) / 2, WZ1, WX2, WZ2, y, y + th, white, [.4, .35 + y * .1, 0]));
[[WX1, (WX1 + WX2) / 2 - .01], [(WX1 + WX2) / 2 + .01, WX2]].forEach(([a, b], i) => wp(a, WZ2, b, WZ2 + th, .1, WY - .05, white, [i ? .6 : -.6, 0, 1.6]));

/* rótulos que seguem o 3D */
const LABELS = [["Cozinha", [2.2, 1.3, 1.0]], ["Dormitório", [6.4, 1.3, 2.4]], ["Sala", [5.0, 1.3, 4.6]], ["Home office", [1.4, 1.3, 4.8]]];
const labelEls = LABELS.map(([txt]) => { const d = document.createElement("div"); d.className = "lbl"; d.textContent = txt; $("#labels").appendChild(d); return d; });
const DIMS = [["8.000", [4, .05, -0.55]], ["6.000", [8.6, .05, 3]], ["3.100", [6.35, 2.9, 0.4]], ["2.550", [8.25, 1.3, 0.45]]];
const dimEls = DIMS.map(([txt]) => { const d = document.createElement("div"); d.className = "dim"; d.textContent = txt; $("#labels").appendChild(d); return d; });
const v3 = new THREE.Vector3();
function place(el, p) { v3.set(p[0] + OFF.x, p[1], p[2] + OFF.z).project(camera); el.style.left = ((v3.x + 1) / 2 * W) + "px"; el.style.top = ((1 - v3.y) / 2 * H) + "px"; }

/* câmera em coordenadas esféricas */
const target = new THREE.Vector3();
function cam(r, phi, theta, tx = 0, ty = 0, tz = 0) {
  target.set(tx, ty, tz);
  camera.position.set(tx + r * Math.sin(phi) * Math.cos(theta), ty + r * Math.cos(phi), tz + r * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(target);
}
const K = (t, keys) => { // interpolação entre quadros-chave [tempo, valor]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [a, va] = keys[i], [b, vb] = keys[i + 1]; if (t <= b) return lerp(va, vb, eio(seg(t, a, b))); }
  return keys[keys.length - 1][1];
};

function render(t) {
  /* ponto → cruz técnica (0–1.6s) */
  const cx = eo(seg(t, .15, 1.0)), cOut = seg(t, 1.3, 1.8);
  $("#cdot").setAttribute("r", 10 * back(seg(t, 0, .3)) * (1 - cOut));
  $("#cx1").setAttribute("x1", 540 - 540 * cx); $("#cx1").setAttribute("x2", 540 + 540 * cx);
  $("#cx2").setAttribute("y1", 960 - 960 * cx); $("#cx2").setAttribute("y2", 960 + 960 * cx);
  $("#cross").style.opacity = 1 - cOut;
  $("#hud").style.opacity = seg(t, .5, 1.0) * (1 - seg(t, 17.2, 17.6));
  $("#pct").textContent = String(Math.round(seg(t, 1, 17) * 100)).padStart(3, "0");
  $("#phase").textContent = t < 4.6 ? "Planta baixa" : t < 8.2 ? "Paredes" : t < 12.4 ? "Móveis planejados" : t < 15.4 ? "Vista explodida" : "Projeto concluído";

  /* câmera */
  const r = K(t, [[0, 26], [1.5, 22], [4.4, 19], [8, 16.5], [10.5, 16], [12.4, 13.5], [15.2, 12.5], [16.2, 18], [17.4, 21]]);
  const phi = K(t, [[0, .04], [4.4, .06], [7.8, .85], [10.5, .8], [12.4, .78], [15.2, .72], [16.4, .25], [17.4, .1]]);
  const theta = K(t, [[0, Math.PI / 2], [4.4, Math.PI / 2 + .1], [8, Math.PI / 2 + .75], [10.5, Math.PI / 2 + 1.0], [12.4, Math.PI / 2 + .35], [15.2, Math.PI / 2 + .1], [17.4, Math.PI / 2 + 2.4]]);
  const tx = K(t, [[10.5, 0], [12.4, 2.3], [15.2, 2.3], [16.2, 0]]), ty = K(t, [[10.5, .6], [12.4, 1.1], [15.2, 1.1], [16.2, .4]]), tz = K(t, [[10.5, 0], [12.4, -1.6], [15.2, -1.6], [16.2, 0]]);
  cam(r, phi, theta, tx, ty, tz);

  /* sol gira no fim */
  const sa = K(t, [[0, .9], [14.6, 1.2], [17.2, 4.4]]);
  sun.position.set(Math.cos(sa) * 10, 12, Math.sin(sa) * 10); sun.intensity = lerp(1.25, 1.6, seg(t, 14.6, 16));
  grid.material.opacity = seg(t, .8, 1.6) * lerp(1, .35, seg(t, 6, 8));

  /* planta se desenha 1.4–4.6s */
  planLines.forEach((l, i) => { l.draw(eio(seg(t, 1.4 + i * .18, 2.4 + i * .18))); l.material.opacity = 1 - seg(t, 7.5, 8.2); });
  furnPlan.forEach((l, i) => { l.draw(eio(seg(t, 2.8 + i * .14, 3.8 + i * .14))); l.material.opacity = 1 - seg(t, 9, 10); });
  slab.material.opacity = 1;

  /* paredes sobem 4.6–8.2s */
  walls.forEach(({ m, e }, i) => {
    const k = back(seg(t, 4.6 + i * .2, 5.6 + i * .2));
    m.scale.y = Math.max(.0001, k); m.visible = k > 0;
    e.material.opacity = seg(t, 4.6 + i * .2, 4.9 + i * .2) * lerp(1, .35, seg(t, 8, 9));
  });

  /* móveis 8.2–12.4s */
  furn.forEach((m, i) => {
    const a = 8.2 + i * .22, k = back(seg(t, a, a + .7));
    m.visible = t >= a; m.scale.y = Math.max(.0001, k);
    m.position.y = m.userData.y1 + (1 - eo(seg(t, a, a + .6))) * 2.5;
    m.userData.e.material.opacity = seg(t, a, a + .2) * lerp(1, .45, seg(t, a + .8, a + 1.4));
  });

  /* guarda-roupa: monta, explode, remonta 8.4–15.4s */
  const ex = eio(seg(t, 12.6, 13.5)) * (1 - eio(seg(t, 14.4, 15.3)));
  wPanels.forEach((m, i) => {
    const a = 8.4 + i * .13, k = back(seg(t, a, a + .6));
    m.visible = t >= a; m.scale.y = Math.max(.0001, k);
    m.position.copy(m.userData.base).addScaledVector(m.userData.dir, ex * 1.1 + (1 - eo(seg(t, a, a + .5))) * 2);
    m.userData.e.material.opacity = Math.max(seg(t, a, a + .2) * (1 - seg(t, a + .8, a + 1.4)) * .9, ex);
  });

  /* rótulos e cotas */
  labelEls.forEach((el, i) => { place(el, LABELS[i][1]); const a = 10.4 + i * .18; el.style.opacity = seg(t, a, a + .25) * (1 - seg(t, 12.2, 12.5)); el.style.transform = `translate(-50%, -50%) scale(${lerp(.6, 1, back(seg(t, a, a + .4)))})`; });
  dimEls.forEach((el, i) => {
    place(el, DIMS[i][1]);
    const on = i < 2 ? seg(t, 2.2 + i * .2, 2.6 + i * .2) * (1 - seg(t, 6.5, 7)) : seg(t, 12.9 + (i - 2) * .15, 13.2 + (i - 2) * .15) * (1 - seg(t, 14.4, 14.7));
    el.style.opacity = on;
  });

  /* textos */
  const tIn = (a, b) => seg(t, a, b);
  $("#title").style.opacity = tIn(5.2, 5.5) * (1 - tIn(7.6, 8));
  $$("#title h2 b").forEach((b, i) => b.style.transform = `translateY(${lerp(110, 0, eo(tIn(5.3 + i * .15, 6.1 + i * .15)))}%)`);
  $("#title .k").style.opacity = tIn(5.2, 5.6);
  $$("#kin p").forEach((p, i) => {
    const a = 15.5 + i * .5, k = seg(t, a, a + .45);
    p.style.opacity = k * (1 - seg(t, 17.0, 17.3));
    p.style.transform = `translateY(${lerp(80, 0, eo(k))}px) scale(${lerp(1.4, 1, eo(k))})`;
    p.style.filter = `blur(${(1 - k) * 18}px)`;
  });

  /* chamada final 17.2–20s */
  $("#end").style.clipPath = `inset(${(1 - eio(seg(t, 17.2, 17.75))) * 100}% 0 0 0)`;
  $$("#endLogo > *").forEach((p, i) => { p.style.strokeDashoffset = 1 - eio(seg(t, 17.6 + i * .06, 18.3 + i * .06)); p.style.fillOpacity = eo(seg(t, 18.2, 18.6)); p.style.strokeWidth = 10 * (1 - seg(t, 18.25, 18.6)); });
  $("#endLogo").style.transform = `translate(-50%, -50%) scale(${lerp(1.25, 1, eo(seg(t, 17.6, 18.6)))})`;
  $("#end .k").style.opacity = seg(t, 18.3, 18.6);
  $$("#end h2 b").forEach((b, i) => b.style.transform = `translateY(${lerp(110, 0, eo(seg(t, 18.35 + i * .1, 19 + i * .1)))}%)`);
  const num = "(51) 98683-1586", n = Math.round(seg(t, 18.7, 19.4) * num.length);
  $("#waTxt").textContent = num.slice(0, n);
  $("#wa").style.transform = `translateX(-50%) scale(${lerp(0, 1, back(seg(t, 18.55, 18.95)))})`;
  $("#end .info").style.opacity = seg(t, 19.2, 19.5);

  renderer.render(scene, camera);
}
window.render = render; window.DURATION = DURATION;
render(0);
</script>
</body>
</html>
